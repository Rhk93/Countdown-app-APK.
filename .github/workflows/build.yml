name: Compila APK Countdown

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai lo zip del progetto
        run: |
          ZIP=$(ls Countdown*.zip 2>/dev/null | head -n 1)
          [ -z "$ZIP" ] && ZIP=$(ls *.zip | head -n 1)
          echo "Zip trovato: $ZIP"
          mkdir -p progetto
          unzip -o -q "$ZIP" -d progetto
          DIR=$(dirname "$(find progetto -name settings.gradle | head -n 1)")
          echo "DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila
        run: cd "$DIR" && gradle assembleRelease --no-daemon

      - name: Prepara APK
        run: cp "$DIR/app/build/outputs/apk/release/app-release.apk" Countdown.apk

      - name: Crea la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Countdown ${{ github.run_number }}
          files: Countdown.apk
